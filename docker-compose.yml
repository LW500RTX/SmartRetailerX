services:
  # LocalStack to emulate AWS DynamoDB, SQS, and EventBridge locally
  localstack:
    image: localstack/localstack:3.4.0
    container_name: smartretailx-localstack
    ports:
      - "4566:4566"
    volumes:
      - "./localstack-init.sh:/etc/localstack/init/ready.d/init-resources.sh"
    environment:
      - SERVICES=dynamodb,sqs,events,ses
      - AWS_DEFAULT_REGION=ap-south-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - smartretailx-net

  # Product Catalogue Express Microservice
  product-api:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: smartretailx-product-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DYNAMODB_TABLE=smartretailx-products-production
      - AWS_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=mock
      - AWS_SECRET_ACCESS_KEY=mock
      - AWS_ENDPOINT_URL=http://localstack:4566
      - EVENT_BUS_NAME=smartretailx-bus
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - localstack
    networks:
      - smartretailx-net

  # MySQL Relational Database for High-Concurrency Order Processing
  mysql-db:
    image: mysql:8.0
    container_name: smartretailx-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: orders
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    networks:
      - smartretailx-net

  # Order Processing FastAPI Microservice
  order-api:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: smartretailx-order-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_HOST=mysql-db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=orders
      - DB_PORT=3306
      # EventBridge environment configuration
      - EVENT_BUS_NAME=smartretailx-bus
      - AWS_REGION=ap-south-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      # Cognito RBAC environment configuration
      - COGNITO_REGION=ap-south-1
      - COGNITO_USER_POOL_ID=ap-south-1_G2uHiC4F0
      - COGNITO_APP_CLIENT_ID=mlukrs75e646ud2ullrkt90mo
      # SMTP Email Configuration (Hardcoded for direct Gmail integration)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=lalanweerasooriya@gmail.com
      - SMTP_PASSWORD=brdl moyg egii zckw
      - SMTP_FROM_EMAIL=lalanweerasooriya@gmail.com
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - localstack
      - mysql-db
    networks:
      - smartretailx-net

  # Inventory SQS Consumer Background Worker (Saga Event Driven poller)
  inventory-worker:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: smartretailx-inventory-worker
    environment:
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/smartretailx-inventory-processing-queue
      - AWS_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=mock
      - AWS_SECRET_ACCESS_KEY=mock
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      - localstack
    networks:
      - smartretailx-net

  # Notification SQS Worker & Email Microservice
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: smartretailx-notification-service
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - SQS_NOTIFICATION_QUEUE_URL=http://localstack:4566/000000000000/smartretailx-notification-queue
      - AWS_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=mock
      - AWS_SECRET_ACCESS_KEY=mock
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SES_SENDER_EMAIL=lalanweerasooriya@gmail.com
      - SES_FALLBACK_RECIPIENT=lalanweerasooriya@gmail.com
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=lalanweerasooriya@gmail.com
      - SMTP_PASSWORD=brdl moyg egii zckw
      - SMTP_FROM_EMAIL=lalanweerasooriya@gmail.com
    depends_on:
      - localstack
    networks:
      - smartretailx-net

  # Standalone Real-Time WebSocket Gateway Companion Microservice
  websocket-gateway:
    build:
      context: ./services/websocket-gateway
      dockerfile: Dockerfile
    container_name: smartretailx-websocket-gateway
    ports:
      - "9001:9001"
    environment:
      - PORT=9001
    networks:
      - smartretailx-net

  # Apache Kafka Zookeeper Service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: smartretailx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - smartretailx-net

  # Apache Kafka Event Streaming Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smartretailx-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - smartretailx-net

  # Apache Kafka High-Throughput Stream Consumer Worker
  kafka-consumer-worker:
    build:
      context: ./services/kafka-consumer-service
      dockerfile: Dockerfile
    container_name: smartretailx-kafka-consumer-worker
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=smartretailx-stream-events
      - KAFKA_GROUP_ID=smartretailx-telemetry-group
    depends_on:
      - kafka
    networks:
      - smartretailx-net

  # Prometheus Metrics Collection Engine
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: smartretailx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - smartretailx-net

  # Grafana Telemetry & Operations Dashboard
  grafana:
    image: grafana/grafana:10.0.0
    container_name: smartretailx-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - smartretailx-net

  # Jaeger All-in-One Distributed Tracing Collector & UI
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: smartretailx-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "6831:6831/udp"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - smartretailx-net

  # Loki Centralized Log Storage Engine
  loki:
    image: grafana/loki:2.8.2
    container_name: smartretailx-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - smartretailx-net

  # Promtail Container Log Collector & Shipper
  promtail:
    image: grafana/promtail:2.8.2
    container_name: smartretailx-promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - smartretailx-net

  # Alertmanager Notification & Routing Engine
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: smartretailx-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command: --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - smartretailx-net

  # AWS X-Ray Daemon for Distributed Tracing
  xray-daemon:
    image: amazon/aws-xray-daemon:3.3.7
    container_name: smartretailx-xray-daemon
    command: ["/xray", "-o", "-b", "0.0.0.0:2000"]
    ports:
      - "2000:2000/udp"
    environment:
      - AWS_REGION=ap-south-1
    networks:
      - smartretailx-net

networks:
  smartretailx-net:
    driver: bridge
